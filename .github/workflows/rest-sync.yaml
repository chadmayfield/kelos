# Keeps the REST version of kelos-capture current with upstream releases.
#
# This fork exists for one change: kelos-capture lists pull requests through the
# REST pulls endpoint instead of "gh pr list", which uses GraphQL. Some HTTP egress
# proxies block GraphQL. Each "v<upstream version>-rest.<n>" tag is upstream
# kelos-dev/kelos at that release plus that one commit. Agentainer's Kelos image
# builds kelos-capture from the newest such tag.
#
# Once a week, and on demand, this workflow:
# 1. reads upstream's newest release;
# 2. stops if a "-rest" tag for that release already exists;
# 3. cherry-picks the REST commit from the newest existing "-rest" tag onto it;
# 4. runs the capture tests and builds kelos-capture;
# 5. pushes the branch "rest/<version>" and the tag "<version>-rest.1".
# A failed cherry-pick or test fails the run, and nothing is pushed. To fix it,
# push a corrected "rest/<version>" branch and a "<version>-rest.<n>" tag by hand;
# the next run builds on that tag.
#
# This workflow lives on main because GitHub runs scheduled workflows only from
# the default branch. Syncing main with upstream must keep this file.
name: rest-sync

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find upstream's newest release and the current REST tag
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/kelos-dev/kelos/releases/latest --jq .tag_name)
          # Exactly vX.Y.Z, so the value is safe to write to GITHUB_OUTPUT and to use in refs.
          # [[ =~ ]] tests the whole string; grep -x would accept a value with a newline.
          if ! [[ $release =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected upstream release tag: $release"
            exit 1
          fi
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name')
          if printf '%s\n' "$tags" | grep -qx "${release}-rest\.[0-9][0-9]*"; then
            echo "A REST tag for $release already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Newest existing REST tag: sort by upstream version, then by n.
          source=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rest\.[0-9]+$' \
            | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)-rest\.([0-9]+)$/\1 \2 \3 \4 &/' \
            | sort -k1,1n -k2,2n -k3,3n -k4,4n | tail -1 | cut -d' ' -f5)
          if [ -z "$source" ]; then
            echo "::error::no existing v<version>-rest.<n> tag to take the REST commit from"
            exit 1
          fi
          {
            echo "release=$release"
            echo "source=$source"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream release $release; REST commit from $source."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.find.outputs.skip == 'false'
        with:
          fetch-depth: 0
          # Only the push step needs the token; it sets it up itself.
          persist-credentials: false

      - name: Cherry-pick the REST commit onto the release
        if: steps.find.outputs.skip == 'false'
        env:
          RELEASE: ${{ steps.find.outputs.release }}
          SOURCE: ${{ steps.find.outputs.source }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/kelos-dev/kelos.git
          git fetch --no-tags upstream "refs/tags/${RELEASE}:refs/tags/${RELEASE}"
          git fetch --no-tags origin "refs/tags/${SOURCE}:refs/tags/${SOURCE}"
          commit=$(git rev-parse "${SOURCE}^{commit}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "${RELEASE}^{commit}"
          if ! git cherry-pick "$commit"; then
            git cherry-pick --abort || true
            echo "::error::the REST commit from ${SOURCE} does not apply to ${RELEASE}; update it by hand"
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        if: steps.find.outputs.skip == 'false'
        with:
          go-version-file: go.mod

      - name: Test and build kelos-capture
        if: steps.find.outputs.skip == 'false'
        run: |
          set -euo pipefail
          go test ./internal/capture/...
          go vet ./internal/capture/...
          go build -o /tmp/kelos-capture ./cmd/kelos-capture

      - name: Push the branch and tag
        if: steps.find.outputs.skip == 'false'
        env:
          RELEASE: ${{ steps.find.outputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "HEAD:refs/heads/rest/${RELEASE}"
          git tag "${RELEASE}-rest.1"
          git push origin "refs/tags/${RELEASE}-rest.1"
          echo "Pushed rest/${RELEASE} and ${RELEASE}-rest.1."
